      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#EC4899;stop-opacity:1" />
